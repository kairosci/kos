name: Security automation

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  workflows:
    name: Workflow security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          advanced-security: false
          annotations: true
          inputs: .github/workflows

  vulnerabilities:
    name: Vulnerability and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          skip-dirs: .git

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          output: codeql-results
      - name: Reject high severity CodeQL findings
        run: |
          set -euo pipefail
          for report in codeql-results/*.sarif; do
            jq -e '[.runs[] | .tool.driver.rules as $rules | .results[]? | .ruleId as $id | ($rules[] | select(.id == $id) | .properties["security-severity"] // "0" | tonumber)] | all(. < 7)' "$report"
          done

  gate:
    name: Security automation gate
    if: always()
    needs: [secrets, workflows, vulnerabilities, dependencies, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful security checks
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          VULNERABILITIES_RESULT: ${{ needs.vulnerabilities.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          [[ "$SECRETS_RESULT" == success && "$WORKFLOWS_RESULT" == success && "$VULNERABILITIES_RESULT" == success && "$CODEQL_RESULT" == success ]]
          [[ "$DEPENDENCIES_RESULT" == success || "$DEPENDENCIES_RESULT" == skipped ]]
