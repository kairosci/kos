---
name: Shell SAST

"on":
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Bash security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install \
            --disable-pip-version-check \
            -r requirements-sast.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: Scan Bash sources
        run: |
          semgrep scan \
            --error \
            --metrics off \
            --config .semgrep.yml \
            --sarif \
            --output semgrep.sarif \
            scripts hooks conf tests clean/scripts clean/scripts/lib/modules \
            obscure/scripts obscure/scripts/lib/modules slop/scripts slop/scripts/lib/modules \
            performance/scripts performance/scripts/lib/modules

      - name: Upload SARIF results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: >-
          github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: semgrep.sarif
