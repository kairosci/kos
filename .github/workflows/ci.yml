name: CI

on:
  push:
    branches: [ main ]
  pull_request:

defaults:
  run:
    working-directory: v2.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-integrity:
    name: Syntax & Code Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Lua Test Runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate Shell Syntax
        run: |
          for sh_file in script/* scripts/*.sh scripts/lib/*.sh scripts/lib/modules/*.sh hooks/theme-set.d/* hooks/pre-refresh-pacman.d/* hooks/post-update.d/* modules/conf/*/*.sh tests/*.sh modules/*/scripts/*.sh modules/*/scripts/lib/*.sh modules/*/scripts/lib/modules/*.sh modules/*/hooks/theme-set.d/* modules/*/hooks/pre-refresh-pacman.d/* modules/*/hooks/post-update.d/* modules/*/tests/*.sh; do
            [ -f "$sh_file" ] || continue
            bash -n "$sh_file"
          done

      - name: Run Syntax & Integrity Test Suite
        run: bash tests/test_syntax_integrity.sh

      - name: Validate Test Harness Failure Detection
        run: bash tests/test_test_harness.sh

  shellcheck-analysis:
    name: ShellCheck Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install ShellCheck (v0.11.0)
        run: |
          SHELLCHECK_VERSION="v0.11.0"
          SHELLCHECK_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          curl -fL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xf shellcheck.tar.xz
          sudo cp "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version

      - name: Run ShellCheck
        run: |
          shellcheck --severity=style \
            script/* scripts/*.sh scripts/lib/*.sh scripts/lib/modules/*.sh \
            hooks/theme-set.d/* hooks/pre-refresh-pacman.d/* hooks/post-update.d/* \
            modules/conf/*/*.sh \
            modules/conf/*/scripts/*.sh \
            tests/*.sh \
            modules/clean/scripts/*.sh modules/clean/scripts/lib/modules/*.sh \
            modules/obscure/scripts/*.sh modules/obscure/scripts/lib/modules/*.sh \
            modules/slop/scripts/*.sh modules/slop/scripts/lib/modules/*.sh \
            modules/performance/scripts/*.sh modules/performance/scripts/lib/modules/*.sh \
            modules/iso/scripts/*.sh \
            modules/theme-previews/scripts/*.sh modules/theme-previews/scripts/lib/*.sh

  idempotency-and-safety:
    name: Automation Safety & Idempotency Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Idempotency & Safety Check
        run: bash tests/test_idempotency_safety.sh

  modular-pipeline-integrity:
    name: Modular Pipeline & Power Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Lua Test Runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run Modular Architecture Tests
        run: bash tests/test_modular_pipeline.sh

      - name: Run Internationalization & Locale Tests
        run: bash tests/test_i18n_locale.sh

      - name: Run Hardware Power Policy Tests
        run: bash tests/test_hardware_power.sh

  theming-and-hook-engine:
    name: Desktop Theming & Application Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Test Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4

      - name: Run Debloat & Theming Tests
        run: bash tests/test_debloat_theming.sh

      - name: Run Application Policy Tests
        run: bash tests/test_application_policy.sh

      - name: Run Update Hook Security Tests
        run: bash tests/test_update_hooks.sh

  arch-container-validation:
    name: Arch Linux Container Full Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
      options: >-
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
    steps:
      - name: Setup Arch Environment
        working-directory: ${{ github.workspace }}
        run: |
          pacman -Syu --noconfirm base-devel git sudo jq python python-yaml lua quickshell imagemagick ripgrep
          useradd -m -G wheel testuser
          echo "testuser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Lua Sources
        run: |
          while IFS= read -r -d '' source; do
            luac -p "$source"
          done < <(find src tests/lua -type f -name '*.lua' -print0)

      - name: Verify Documentation Languages
        run: script/os-lua verify-documentation

      - name: Run Full Test Suite
        run: lua -E tests/main.lua "$PWD" --group full

  osmp-validation:
    name: OSMP Media Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run OSMP Tests
        run: npm test --prefix modules/plugins/osmp

  ci-status-gate:
    name: CI Completion Status Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - syntax-integrity
      - shellcheck-analysis
      - idempotency-and-safety
      - modular-pipeline-integrity
      - theming-and-hook-engine
      - arch-container-validation
      - osmp-validation
    steps:
      - name: CI Success Assertion
        working-directory: ${{ github.workspace }}
        run: echo "All os CI jobs and test suites completed successfully."
