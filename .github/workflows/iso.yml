name: ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iso-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate immutable release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build-sha: ${{ steps.release.outputs.build_sha }}
      iso-name: ${{ steps.release.outputs.iso_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Resolve signed release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          bash modules/iso/scripts/resolve-release.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build OS ISO
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.build-sha }}
          persist-credentials: false
      - name: Install ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq xorriso
      - name: Stage complete configuration
        run: |
          set -euo pipefail
          overlay="$RUNNER_TEMP/os-overlay"
          source_tree="$RUNNER_TEMP/os-source"
          mkdir -p "$overlay/opt/os" "$source_tree"
          git archive HEAD | tar -x -C "$source_tree"
          cp -aL "$source_tree/." "$overlay/opt/os/"
          cp -aL "$source_tree/modules/iso/overlay/." "$overlay/"
      - name: Build customized ISO
        run: |
          set -euo pipefail
          bash modules/iso/scripts/customize.sh \
            --overlay "$RUNNER_TEMP/os-overlay" \
            --output "$RUNNER_TEMP/os-base.iso"
      - name: Upload ISO artifact for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-iso
          path: ${{ runner.temp }}/os-base.iso
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  verify:
    name: Verify finished ISO contents
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - name: Install ISO inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes xorriso
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-iso
          path: ${{ runner.temp }}/os-iso
      - name: Verify configuration extracted from the ISO
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.build-sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          bash modules/iso/scripts/verify-iso.sh \
            --iso "$RUNNER_TEMP/os-iso/os-base.iso" \
            --ref "$RELEASE_TAG" \
            --expected-commit "$EXPECTED_COMMIT"

  release:
    name: Publish verified ISO
    needs: [resolve, verify]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.build-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-iso
          path: ${{ runner.temp }}/os-iso
      - name: Publish immutable stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          ISO_NAME: ${{ needs.resolve.outputs.iso-name }}
        run: |
          set -euo pipefail
          final_iso="$RUNNER_TEMP/os-iso-publish/$ISO_NAME"
          mkdir -p "$(dirname "$final_iso")"
          mv "$RUNNER_TEMP/os-iso/os-base.iso" "$final_iso"
          iso_dir="$(dirname "$final_iso")"
          (cd "$iso_dir" && sha256sum "$ISO_NAME" > "$ISO_NAME.sha256")
          split --bytes=1900M --numeric-suffixes=0 --suffix-length=2 "$final_iso" "$final_iso.part-"
          mapfile -t iso_parts < <(find "$iso_dir" -maxdepth 1 -type f -name "$ISO_NAME.part-*" -print | LC_ALL=C sort)
          ((${#iso_parts[@]} > 0))
          gh release create "$RELEASE_TAG" "${iso_parts[@]}" "$iso_dir/$ISO_NAME.sha256" \
            modules/iso/scripts/download-release.sh modules/iso/scripts/download-release.ps1 \
            --verify-tag --title "$RELEASE_TAG" --notes-file /dev/null
