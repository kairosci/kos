name: ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish OS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out tagged configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+)$ ]]

      - name: Install ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq xorriso

      - name: Stage complete OS configuration in the ISO overlay
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          overlay="$RUNNER_TEMP/os-overlay"
          source_tree="$RUNNER_TEMP/os-source"
          mkdir -p "$overlay/opt/os" "$source_tree"
          git archive "$GITHUB_SHA" | tar -x -C "$source_tree"
          cp -aL "$source_tree/." "$overlay/opt/os/"
          cp -aL "$source_tree/modules/iso/overlay/." "$overlay/"
          printf 'commit=%s\n' "$GITHUB_SHA" > "$overlay/opt/os-release.txt"

      - name: Build customized ISO
        id: build
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          bash modules/iso/scripts/customize.sh \
            --overlay "$RUNNER_TEMP/os-overlay" \
            --output "$RUNNER_TEMP/os-base.iso"

          inspected_tree="$RUNNER_TEMP/os-inspected/opt/os"
          mkdir -p "$(dirname "$inspected_tree")"
          xorriso -osirrox on \
            -indev "$RUNNER_TEMP/os-base.iso" \
            -extract /opt/os "$inspected_tree"
          diff -qr "$RUNNER_TEMP/os-overlay/opt/os" "$inspected_tree"
          printf 'commit=%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/os-release.expected"
          cmp "$RUNNER_TEMP/os-release.expected" "$RUNNER_TEMP/os-inspected/opt/os-release.txt"

          final_iso="$RUNNER_TEMP/os-${RELEASE_TAG}.iso"
          mv "$RUNNER_TEMP/os-base.iso" "$final_iso"
          iso_name="$(basename "$final_iso")"
          (cd "$RUNNER_TEMP" && sha256sum "$iso_name" > "$iso_name.sha256")
          split --bytes=1900M --numeric-suffixes=0 --suffix-length=2 \
            "$final_iso" "$final_iso.part-"
          echo "iso_path=$final_iso" >> "$GITHUB_OUTPUT"
          echo "iso_name=$iso_name" >> "$GITHUB_OUTPUT"

      - name: Publish ISO and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          ISO_PATH: ${{ steps.build.outputs.iso_path }}
          ISO_NAME: ${{ steps.build.outputs.iso_name }}
        run: |
          set -euo pipefail
          mapfile -t iso_parts < <(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "$ISO_NAME.part-*" -print | LC_ALL=C sort)
          ((${#iso_parts[@]} > 0))
          release_assets=("${iso_parts[@]}" "$ISO_PATH.sha256" modules/iso/scripts/download-release.sh modules/iso/scripts/download-release.ps1)
          gh release create "$RELEASE_TAG" \
            "${release_assets[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file /dev/null
