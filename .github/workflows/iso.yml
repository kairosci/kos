name: ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build OS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      iso-name: ${{ steps.build.outputs.iso_name }}
      build-sha: ${{ steps.stage.outputs.build_sha }}
    steps:
      - name: Check out tagged configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+)$ ]]

      - name: Install ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq xorriso

      - name: Stage complete OS configuration in the ISO overlay
        id: stage
        run: |
          set -euo pipefail
          overlay="$RUNNER_TEMP/os-overlay"
          source_tree="$RUNNER_TEMP/os-source"
          mkdir -p "$overlay/opt/os" "$source_tree"
          build_sha="$(git rev-parse HEAD)"
          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"
          git archive "$build_sha" | tar -x -C "$source_tree"
          cp -aL "$source_tree/." "$overlay/opt/os/"
          cp -aL "$source_tree/modules/iso/overlay/." "$overlay/"
          printf 'commit=%s\n' "$build_sha" > "$overlay/opt/os-release.txt"

      - name: Build customized ISO
        id: build
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          bash modules/iso/scripts/customize.sh \
            --overlay "$RUNNER_TEMP/os-overlay" \
            --output "$RUNNER_TEMP/os-base.iso"
          echo "iso_name=os-${RELEASE_TAG}.iso" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-iso
          path: ${{ runner.temp }}/os-base.iso
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  verify:
    name: Verify ISO contents
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out tagged configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Install ISO inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes xorriso

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-iso
          path: ${{ runner.temp }}/os-iso

      - name: Verify bundled configuration without installing
        run: |
          set -euo pipefail
          bash modules/iso/scripts/verify-iso.sh \
            --iso "${{ runner.temp }}/os-iso/os-base.iso" \
            --ref "$RELEASE_TAG" \
            --expected-commit "${{ needs.build.outputs.build-sha }}"

  release:
    name: Publish OS ISO
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Download verified ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-iso
          path: ${{ runner.temp }}/os-iso

      - name: Publish ISO and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          ISO_NAME: ${{ needs.build.outputs.iso-name }}
        run: |
          set -euo pipefail
          final_iso="$RUNNER_TEMP/os-iso-publish/$ISO_NAME"
          mkdir -p "$(dirname "$final_iso")"
          mv "$RUNNER_TEMP/os-iso/os-base.iso" "$final_iso"
          iso_dir="$(dirname "$final_iso")"
          (cd "$iso_dir" && sha256sum "$ISO_NAME" > "$ISO_NAME.sha256")
          split --bytes=1900M --numeric-suffixes=0 --suffix-length=2 \
            "$final_iso" "$final_iso.part-"
          mapfile -t iso_parts < <(find "$iso_dir" -maxdepth 1 -type f -name "$ISO_NAME.part-*" -print | LC_ALL=C sort)
          ((${#iso_parts[@]} > 0))
          release_assets=("${iso_parts[@]}" "$iso_dir/$ISO_NAME.sha256" modules/iso/scripts/download-release.sh modules/iso/scripts/download-release.ps1)
          gh release create "$RELEASE_TAG" \
            "${release_assets[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file /dev/null
