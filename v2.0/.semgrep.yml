rules:
  - id: bash.security.remote-script-execution
    message: Downloaded content is piped directly into a shell.
    severity: ERROR
    languages:
      - bash
    pattern-either:
      - pattern: curl ... | sh
      - pattern: curl ... | bash
      - pattern: wget ... | sh
      - pattern: wget ... | bash
  - id: lua.security.executable-data
    message: Data files must not be evaluated as Lua source.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - v2.0/src/**/*.lua
    pattern-regex: '\b(loadstring|loadfile|dofile)\s*\('
  - id: lua.security.unowned-process-execution
    message: Native processes must use the shared argument quoting implementation.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - v2.0/src/**/*.lua
      exclude:
        - v2.0/src/core/process.lua
    pattern-regex: '\b(os\.execute|io\.popen)\s*\('
